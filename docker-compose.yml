# RetailControl — entorno de DESARROLLO.
# Levanta PostgreSQL 16 con los roles rc_owner / rc_app / rc_backup ya creados.
#   cp .env.example .env   (y reemplace los valores CAMBIAR)
#   docker compose up -d
# La app y el worker se ejecutan en el host con pnpm (ver README).
name: retailcontrol

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
      RC_OWNER_PASSWORD: ${RC_OWNER_PASSWORD:?Defina RC_OWNER_PASSWORD en .env}
      RC_APP_PASSWORD: ${RC_APP_PASSWORD:?Defina RC_APP_PASSWORD en .env}
      RC_BACKUP_PASSWORD: ${RC_BACKUP_PASSWORD:?Defina RC_BACKUP_PASSWORD en .env}
      RC_DB_NAME: ${RC_DB_NAME:-retailcontrol}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/bootstrap.sql:/opt/retailcontrol/bootstrap.sql:ro
      - ./scripts/db/docker-init.sh:/docker-entrypoint-initdb.d/10-retailcontrol.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
